<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şifre Oluşturucu - ToolNova</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    text-align:center;
    padding:40px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

button{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
    margin-top:15px;
    background:#2563eb;
    color:white;
}

input{
    width:100%;
    padding:12px;
    font-size:18px;
    margin-top:20px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<h1>🔑 Şifre Oluşturucu</h1>

<p>Güçlü ve rastgele şifre oluşturun</p>

<input id="sonuc" type="text" readonly placeholder="Şifren burada görünecek">

<br>

<button onclick="uret()">Şifre Üret</button>

<br><br>

<a href="index.html">🏠 Ana Sayfa</a>

</div>

<script>
function uret(){
    let chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
    let password = "";

    for(let i=0;i<12;i++){
        password += chars.charAt(Math.floor(Math.random() * chars.length));
    }

    document.getElementById("sonuc").value = password;
}
</script>

</body>
</html>
