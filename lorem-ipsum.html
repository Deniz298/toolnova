<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lorem Ipsum Oluşturucu | ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
margin:0;
padding:30px;
}
.container{
max-width:700px;
margin:auto;
background:#1f2937;
padding:30px;
border-radius:15px;
}
input{
width:100%;
padding:12px;
font-size:18px;
margin:15px 0;
border:none;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
textarea{
width:100%;
height:250px;
margin-top:20px;
padding:10px;
font-size:16px;
border-radius:8px;
}
a{
display:inline-block;
margin-top:20px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>📝 Lorem Ipsum Oluşturucu</h1>

<input type="number" id="count" value="3" min="1" max="20">

<button onclick="createText()">Oluştur</button>

<textarea id="output"></textarea>

<a href="index.html">← Ana Sayfaya Dön</a>

</div>

<script>

const lorem="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";

function createText(){

let count=parseInt(document.getElementById("count").value);

let text="";

for(let i=0;i<count;i++){

text+=lorem+"\n\n";

}

document.getElementById("output").value=text;

}

createText();

</script>

</body>
</html>
