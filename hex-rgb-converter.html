<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HEX ↔ RGB Dönüştürücü | ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
margin:0;
padding:30px;
}

.container{
max-width:600px;
margin:auto;
background:#1f2937;
padding:30px;
border-radius:15px;
text-align:center;
}

input{
width:90%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
padding:12px 20px;
margin:8px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:20px;
font-weight:bold;
}

a{
display:block;
margin-top:20px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🎨 HEX ↔ RGB Dönüştürücü</h1>

<input id="hex" placeholder="#2563EB">

<button onclick="hexToRgb()">HEX → RGB</button>

<div class="result" id="result"></div>

<a href="index.html">← Ana Sayfaya Dön</a>

</div>

<script>

function hexToRgb(){

let hex=document.getElementById("hex").value.replace("#","");

if(hex.length!=6){
document.getElementById("result").innerHTML="Geçerli HEX giriniz.";
return;
}

let r=parseInt(hex.substring(0,2),16);
let g=parseInt(hex.substring(2,4),16);
let b=parseInt(hex.substring(4,6),16);

document.getElementById("result").innerHTML=
"RGB("+r+", "+g+", "+b+")";

}

</script>

</body>
</html>
