<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metin Ters Çevirici - ToolNova</title>
</head>
<body style="font-family:Arial;text-align:center;padding:30px;">

<h1>🔄 Metin Ters Çevirici</h1>

<textarea id="metin" rows="6" cols="40"></textarea>

<br><br>

<button onclick="cevir()">Ters Çevir</button>

<h2 id="sonuc"></h2>

<script>
function cevir(){
let metin=document.getElementById("metin").value;
let ters=metin.split("").reverse().join("");
document.getElementById("sonuc").innerText=ters;
}
</script>

</body>
</html>
