<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarih Hesaplama | ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
margin:0;
padding:30px;
}

.container{
max-width:600px;
margin:auto;
background:#1f2937;
padding:30px;
border-radius:15px;
}

h1{
text-align:center;
}

input{
width:100%;
padding:12px;
margin:12px 0;
font-size:18px;
border:none;
border-radius:8px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:22px;
text-align:center;
}

a{
display:inline-block;
margin-top:25px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>📅 Tarih Hesaplama</h1>

<input type="date" id="start">

<input type="date" id="end">

<button onclick="calc()">Hesapla</button>

<div class="result" id="result"></div>

<a href="index.html">← Ana Sayfaya Dön</a>

</div>

<script>

function calc(){

let start=new Date(document.getElementById("start").value);

let end=new Date(document.getElementById("end").value);

if(isNaN(start)||isNaN(end)){
document.getElementById("result").innerHTML="İki tarihi seçiniz.";
return;
}

let diff=Math.abs(end-start);

let days=Math.floor(diff/(1000*60*60*24));

document.getElementById("result").innerHTML=
"İki tarih arasında <b>"+days+"</b> gün vardır.";

}

</script>

</body>
</html>
