<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yazı Tura - ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:50px;
}

.box{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

button{
padding:15px 30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

#result{
font-size:40px;
margin-top:25px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="box">

<h1>🪙 Yazı Tura</h1>

<p>Butona bas ve sonucu öğren.</p>

<button onclick="flipCoin()">Yazı Tura At</button>

<div id="result">?</div>

</div>

<script>
function flipCoin(){
const sonuc=Math.random()<0.5?"YAZI":"TURA";
document.getElementById("result").innerText=sonuc;
}
</script>

</body>
</html>
