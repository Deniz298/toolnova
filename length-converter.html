<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uzunluk Dönüştürücü | ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
margin:0;
padding:30px;
}
.container{
max-width:600px;
margin:auto;
background:#1f2937;
padding:30px;
border-radius:15px;
}
input,select{
width:100%;
padding:12px;
margin:10px 0;
font-size:18px;
border:none;
border-radius:8px;
}
button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
.result{
margin-top:20px;
font-size:22px;
text-align:center;
}
a{
display:inline-block;
margin-top:20px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>📏 Uzunluk Dönüştürücü</h1>

<input type="number" id="meter" placeholder="Metre">

<select id="unit">
<option value="100">Santimetre</option>
<option value="1000">Milimetre</option>
<option value="0.001">Kilometre</option>
</select>

<button onclick="convert()">Dönüştür</button>

<div class="result" id="result"></div>

<a href="index.html">← Ana Sayfaya Dön</a>

</div>

<script>

function convert(){

let value=parseFloat(document.getElementById("meter").value);

let rate=parseFloat(document.getElementById("unit").value);

if(isNaN(value)){
document.getElementById("result").innerHTML="Lütfen bir değer giriniz.";
return;
}

document.getElementById("result").innerHTML=
"Sonuç: <b>"+(value*rate)+"</b>";

}

</script>

</body>
</html>
