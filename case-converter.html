<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Büyük/Küçük Harf Dönüştürücü - ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6f9;
padding:40px;
text-align:center;
}

.container{
max-width:800px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

textarea{
width:100%;
height:200px;
padding:10px;
font-size:16px;
margin:20px 0;
}

button{
padding:12px 20px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.result{
margin-top:20px;
}
</style>
</head>

<body>

<div class="container">

<h1>🔠 Büyük / Küçük Harf Dönüştürücü</h1>

<textarea id="metin" placeholder="Metninizi girin..."></textarea>

<br>

<button onclick="buyuk()">BÜYÜK HARF</button>
<button onclick="kucuk()">küçük harf</button>
<button onclick="ilkHarf()">İlk Harfleri Büyük</button>

<div class="result">
<textarea id="sonuc"></textarea>
</div>

<p><a href="index.html">🏠 Ana Sayfa</a></p>

</div>

<script>
function buyuk(){
document.getElementById("sonuc").value =
document.getElementById("metin").value.toUpperCase();
}

function kucuk(){
document.getElementById("sonuc").value =
document.getElementById("metin").value.toLowerCase();
}

function ilkHarf(){
let text =
document.getElementById("metin").value.toLowerCase();

let sonuc =
text.replace(/\b\w/g,function(harf){
return harf.toUpperCase();
});

document.getElementById("sonuc").value = sonuc;
}
</script>

</body>
</html>
