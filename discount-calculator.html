<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>İndirim Hesaplama | ToolNova</title>

<meta name="description" content="İndirimli fiyatı ve tasarruf miktarını ücretsiz hesaplayın.">

<style>
body{
font-family:Arial,sans-serif;
background:#111827;
color:white;
margin:0;
padding:30px;
}

.container{
max-width:600px;
margin:auto;
background:#1f2937;
padding:30px;
border-radius:15px;
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:18px;
}

button{
width:100%;
padding:12px;
background:#2563eb;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:20px;
font-size:22px;
text-align:center;
line-height:1.8;
}

a{
display:inline-block;
margin-top:25px;
color:#60a5fa;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>🏷️ İndirim Hesaplama</h1>

<input type="number" id="price" placeholder="Ürün Fiyatı">

<input type="number" id="discount" placeholder="İndirim Oranı (%)">

<button onclick="calculate()">Hesapla</button>

<div class="result" id="result"></div>

<a href="index.html">← Ana Sayfaya Dön</a>

</div>

<script>

function calculate(){

let price=parseFloat(document.getElementById("price").value);
let discount=parseFloat(document.getElementById("discount").value);

if(isNaN(price)||isNaN(discount)){
document.getElementById("result").innerHTML="Lütfen tüm alanları doldurun.";
return;
}

let save=price*discount/100;
let total=price-save;

document.getElementById("result").innerHTML=
"İndirim Tutarı: <b>"+save.toFixed(2)+" TL</b><br>" +
"Ödenecek Tutar: <b>"+total.toFixed(2)+" TL</b>";

}

</script>

</body>
</html>
