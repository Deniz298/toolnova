<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Kelime Sayacı - ToolNova</title>
</head>

<body style="font-family:Arial; text-align:center;">

<h1>Kelime Sayacı</h1>

<textarea id="text" rows="6" cols="40"></textarea>
<br><br>

<button onclick="say()">Say</button>

<p id="sonuc"></p>

<script>
function say(){
let metin = document.getElementById("text").value;
let kelime = metin.trim().split(/\s+/).length;
if(metin.trim() === "") kelime = 0;
document.getElementById("sonuc").innerText = "Kelime: " + kelime;
}
</script>

</body>
</html>
