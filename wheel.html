<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Şans Çarkı - ToolNova</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f5f5f5;
text-align:center;
padding:40px;
}

.box{
max-width:600px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

button{
padding:15px 30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

#result{
margin-top:25px;
font-size:30px;
font-weight:bold;
color:#2563eb;
}
</style>
</head>

<body>

<div class="box">

<h1>🎡 Şans Çarkı</h1>

<p>Butona bas ve rastgele sonucu öğren.</p>

<button onclick="spin()">Çevir</button>

<div id="result">?</div>

</div>

<script>
function spin(){

const options=[
"🎉 Kazandın",
"😎 Şanslı Gün",
"🍀 Çok Şanslısın",
"💰 Ödül",
"⭐ Bonus",
"🎁 Sürpriz",
"😅 Tekrar Dene"
];

const random=
options[Math.floor(Math.random()*options.length)];

document.getElementById("result").innerText=random;
}
</script>

</body>
</html>
